<!DOCTYPE html>
<html lang="pt-BR">

    <title>CyberStrike - Arena do Futuro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <span class="badge-superior">
            TEMPORADA 04 ATIVA

        <h1>CyberStrike: Arena do Futuro</h1>

        <p class="descricao">
            Monte seu esquadrão cibernético, dispute
            torneios semanais e domine os servidores
            de alta perfomace com taxas de 144 FPS
            e premiações exclusivas.
        </p>

        <div class="informacoes">
            <span class="info azul"> Anti-Cheat</span>
            <span class="info"> 128 Tick</span>
            <span class="info">Ranqueado</span>
        </div>
        <a href="#" class="botao">
            JOGAR AGORA
        </a>

        <div class="ilustracao">

            <div class="circulo-externo">
                <div class="circulo-interno">

                    <span class="raio"></span>

                    <div class="controle">
                        <div class="botao-controle"></div>

                        <div class="analógico esquerdo"></div>
                        <div class="analógico direito"></div>

                        <div class="luz verde"></div>
                        <div class="çuz vermelha"></div>

                    </div>

                </div>
            </div>
            
        </div>
    </main>
